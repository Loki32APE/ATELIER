<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 940" role="img" aria-labelledby="title desc">
  <title id="title">Custom Atelier A mark study</title>
  <desc id="desc">Three custom letter A studies paired with an open frame and Atelier wordmark. Exploratory only.</desc>
  <rect width="1500" height="940" fill="#242521"/>
