<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 1000" role="img" aria-labelledby="title desc">
  <title id="title">Modern Atelier dual-mode palette candidate</title>
  <desc id="desc">An updated modern palette pairing ink-charcoal and titanium dark mode with warm stone light mode, muted bronze and mineral teal accents.</desc>
  <rect width="1500" height="1000" fill="#171A19"/>
  <text x="70" y="88" fill="#ECEBE4" font-family="Georgia,serif" font-size="42">Modern Atelier · palette study</text>
  <text x="70" y="124" fill="#A9B0AB" font-family="Arial,sans-serif" font-size="15" letter-spacing="1.7">INK CHARCOAL · TITANIUM · MUTED BRONZE · MINERAL TEAL · WARM STONE</text>

