<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 1000" role="img" aria-labelledby="title desc">
  <title id="title">Bronze Atelier dark and light palette study</title>
  <desc id="desc">Candidate paired dark and light theme palettes with the same optical emblem concept.</desc>
  <rect width="1500" height="1000" fill="#1D1E1B"/>
  <text x="70" y="88" fill="#EEE8DC" font-family="Georgia,serif" font-size="42">Bronze Atelier · dual-mode palette</text>
  <text x="70" y="124" fill="#BDB6A8" font-family="Arial,sans-serif" font-size="15" letter-spacing="1.7">SAME BRAND CHARACTER · CONTRAST-ADAPTED COLORS · CANDIDATE PAIR</text>

  <g transform="translate(70 175)">
    <rect width="660" height="740" rx="8" fill="#242521" stroke="#57564D"/>
    <text x="34" y="52" fill="#AE8B5C" font-family="Arial,sans-serif" font-size="13" letter-spacing="2">DARK MODE</text>
    <text x="34" y="94" fill="#EEE8DC" font-family="Georgia,serif" font-size="30">Bronze in graphite</text>
    <rect x="34" y="126" width="592" height="300" rx="5" fill="#30312D" stroke="#4D4D45"/>
    <path d="M57 158h28" stroke="#AE8B5C" stroke-width="2"/>
    <text x="57" y="194" fill="#EEE8DC" font-family="Georgia,serif" font-size="25">Vision Studio</text>
    <text x="57" y="220" fill="#BDB6A8" font-family="Arial,sans-serif" font-size="13">Shape a visual idea with references.</text>
    <rect x="57" y="248" width="236" height="134" rx="4" fill="#242521" stroke="#AE8B5C" stroke-dasharray="2 5"/>
    <circle cx="175" cy="315" r="44" fill="none" stroke="#AE8B5C" stroke-width="2"/>
    <circle cx="175" cy="315" r="33" fill="none" stroke="#7C796F" stroke-width="1.5"/>
    <path d="M175 277c16 5 28 17 33 32l-20 10c-3-8-8-13-14-15zM175 277c16 5 28 17 33 32l-20 10c-3-8-8-13-14-15z" fill="#AE8B5C" transform="rotate(0 175 315)"/>
    <path d="M175 277c16 5 28 17 33 32l-20 10c-3-8-8-13-14-15z" fill="#7C796F" transform="rotate(60 175 315)"/>
    <path d="M175 277c16 5 28 17 33 32l-20 10c-3-8-8-13-14-15z" fill="#AE8B5C" transform="rotate(120 175 315)"/>
    <path d="M175 277c16 5 28 17 33 32l-20 10c-3-8-8-13-14-15z" fill="#7C796F" transform="rotate(180 175 315)"/>
    <path d="M175 277c16 5 28 17 33 32l-20 10c-3-8-8-13-14-15z" fill="#AE8B5C" transform="rotate(240 175 315)"/>
    <path d="M175 277c16 5 28 17 33 32l-20 10c-3-8-8-13-14-15z" fill="#7C796F" transform="rotate(300 175 315)"/>
    <circle cx="175" cy="315" r="7" fill="#EEE8DC"/>
    <text x="322" y="286" fill="#EEE8DC" font-family="Arial,sans-serif" font-size="15" font-weight="700">Prompt direction</text>
    <text x="322" y="312" fill="#BDB6A8" font-family="Arial,sans-serif" font-size="13">Supporting copy stays soft.</text>
    <rect x="322" y="338" width="154" height="38" rx="4" fill="#AE8B5C"/>
    <text x="399" y="362" text-anchor="middle" fill="#242521" font-family="Arial,sans-serif" font-size="12" font-weight="700">Build prompt</text>
    <text x="34" y="476" fill="#BDB6A8" font-family="Arial,sans-serif" font-size="12" letter-spacing="1">CANVAS</text>
    <text x="210" y="476" fill="#BDB6A8" font-family="Arial,sans-serif" font-size="12" letter-spacing="1">SURFACE</text>
    <text x="386" y="476" fill="#BDB6A8" font-family="Arial,sans-serif" font-size="12" letter-spacing="1">TEXT</text>
    <text x="518" y="476" fill="#BDB6A8" font-family="Arial,sans-serif" font-size="12" letter-spacing="1">ACCENT</text>
    <rect x="34" y="492" width="118" height="44" rx="3" fill="#242521" stroke="#66655A"/><rect x="210" y="492" width="118" height="44" rx="3" fill="#30312D" stroke="#66655A"/><rect x="386" y="492" width="118" height="44" rx="3" fill="#EEE8DC"/><rect x="518" y="492" width="108" height="44" rx="3" fill="#AE8B5C"/>
    <text x="34" y="558" fill="#BDB6A8" font-family="Arial,sans-serif" font-size="12">#242521</text><text x="210" y="558" fill="#BDB6A8" font-family="Arial,sans-serif" font-size="12">#30312D</text><text x="386" y="558" fill="#BDB6A8" font-family="Arial,sans-serif" font-size="12">#EEE8DC</text><text x="518" y="558" fill="#BDB6A8" font-family="Arial,sans-serif" font-size="12">#AE8B5C</text>
    <text x="34" y="626" fill="#788071" font-family="Arial,sans-serif" font-size="13">Quiet, cinematic, crafted. Bronze is an accent,</text>
    <text x="34" y="650" fill="#788071" font-family="Arial,sans-serif" font-size="13">not a large glowing surface.</text>
  </g>

  <g transform="translate(770 175)">
    <rect width="660" height="740" rx="8" fill="#E8E2D7" stroke="#BDB6A8"/>
    <text x="34" y="52" fill="#785B34" font-family="Arial,sans-serif" font-size="13" letter-spacing="2">LIGHT MODE · CANDIDATE</text>
    <text x="34" y="94" fill="#282A25" font-family="Georgia,serif" font-size="30">Bronze on warm stone</text>
    <rect x="34" y="126" width="592" height="300" rx="5" fill="#F2EEE5" stroke="#C7C0B2"/>
    <path d="M57 158h28" stroke="#785B34" stroke-width="2"/>
    <text x="57" y="194" fill="#282A25" font-family="Georgia,serif" font-size="25">Vision Studio</text>
    <text x="57" y="220" fill="#65645D" font-family="Arial,sans-serif" font-size="13">Shape a visual idea with references.</text>
    <rect x="57" y="248" width="236" height="134" rx="4" fill="#E8E2D7" stroke="#785B34" stroke-dasharray="2 5"/>
    <circle cx="175" cy="315" r="44" fill="none" stroke="#785B34" stroke-width="2"/>
    <circle cx="175" cy="315" r="33" fill="none" stroke="#928D80" stroke-width="1.5"/>
    <path d="M175 277c16 5 28 17 33 32l-20 10c-3-8-8-13-14-15z" fill="#785B34"/>
    <path d="M175 277c16 5 28 17 33 32l-20 10c-3-8-8-13-14-15z" fill="#C7C0B2" transform="rotate(60 175 315)"/><path d="M175 277c16 5 28 17 33 32l-20 10c-3-8-8-13-14-15z" fill="#785B34" transform="rotate(120 175 315)"/><path d="M175 277c16 5 28 17 33 32l-20 10c-3-8-8-13-14-15z" fill="#C7C0B2" transform="rotate(180 175 315)"/><path d="M175 277c16 5 28 17 33 32l-20 10c-3-8-8-13-14-15z" fill="#785B34" transform="rotate(240 175 315)"/><path d="M175 277c16 5 28 17 33 32l-20 10c-3-8-8-13-14-15z" fill="#C7C0B2" transform="rotate(300 175 315)"/>
    <circle cx="175" cy="315" r="7" fill="#282A25"/>
    <text x="322" y="286" fill="#282A25" font-family="Arial,sans-serif" font-size="15" font-weight="700">Prompt direction</text>
    <text x="322" y="312" fill="#65645D" font-family="Arial,sans-serif" font-size="13">Supporting copy stays soft.</text>
    <rect x="322" y="338" width="154" height="38" rx="4" fill="#3D5145"/>
    <text x="399" y="362" text-anchor="middle" fill="#F2EEE5" font-family="Arial,sans-serif" font-size="12" font-weight="700">Build prompt</text>
    <text x="34" y="476" fill="#65645D" font-family="Arial,sans-serif" font-size="12" letter-spacing="1">CANVAS</text>
    <text x="210" y="476" fill="#65645D" font-family="Arial,sans-serif" font-size="12" letter-spacing="1">SURFACE</text>
    <text x="386" y="476" fill="#65645D" font-family="Arial,sans-serif" font-size="12" letter-spacing="1">TEXT</text>
    <text x="518" y="476" fill="#65645D" font-family="Arial,sans-serif" font-size="12" letter-spacing="1">ACCENT</text>
    <rect x="34" y="492" width="118" height="44" rx="3" fill="#E8E2D7" stroke="#BDB6A8"/><rect x="210" y="492" width="118" height="44" rx="3" fill="#F2EEE5" stroke="#BDB6A8"/><rect x="386" y="492" width="118" height="44" rx="3" fill="#282A25"/><rect x="518" y="492" width="108" height="44" rx="3" fill="#785B34"/>
    <text x="34" y="558" fill="#65645D" font-family="Arial,sans-serif" font-size="12">#E8E2D7</text><text x="210" y="558" fill="#65645D" font-family="Arial,sans-serif" font-size="12">#F2EEE5</text><text x="386" y="558" fill="#65645D" font-family="Arial,sans-serif" font-size="12">#282A25</text><text x="518" y="558" fill="#65645D" font-family="Arial,sans-serif" font-size="12">#785B34</text>
    <text x="34" y="626" fill="#4F5E4A" font-family="Arial,sans-serif" font-size="13">Warm, readable, still cinematic. Darken the</text>
    <text x="34" y="650" fill="#4F5E4A" font-family="Arial,sans-serif" font-size="13">bronze for clear actions and emblem detail.</text>
  </g>
  <text x="70" y="965" fill="#BDB6A8" font-family="Arial,sans-serif" font-size="13">Light-mode values and emblem contrast are candidates for review, not locked tokens.</text>
</svg>
