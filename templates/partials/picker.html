  <!-- Modal Picker Bottom Sheet (Radio Selector List matching user screenshot) -->
  <div class="picker-backdrop" id="pickerBackdrop" onclick="closePickerModal()"></div>
  <div class="picker-modal-sheet" id="pickerModal" role="dialog" aria-modal="true" aria-labelledby="pickerTitleText" aria-hidden="true" tabindex="-1">
    <div class="picker-sheet-header">
      <div class="picker-title-row">
        <span class="picker-title-text" id="pickerTitleText">Select Attribute</span>
      </div>
      <button type="button" class="picker-close-btn" aria-label="Close picker" onclick="closePickerModal()">Close</button>
    </div>
    <div class="picker-search-bar">
      <input type="text" id="pickerSearchInput" aria-label="Filter picker options" placeholder="Filter options..." oninput="filterPickerOptions(this.value)">
    </div>
    <div class="picker-options-scroll" id="pickerOptionsList" role="radiogroup" aria-label="Picker options">
      <!-- Dynamically filled radio items -->
    </div>
  </div>
