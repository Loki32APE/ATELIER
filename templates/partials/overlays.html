  <!-- Minimized Floating Dock -->
  <div class="minimized-dock-bar" id="minimizedDock" role="button" tabindex="0" aria-label="Open minimized prompt output" onclick="expandOutput()" style="display:none;">
    <div class="dock-pulse-indicator"></div>
    <span class="dock-title" id="dockTitle">Master Prompt Ready</span>
    <span class="dock-action">Tap to Open ▲</span>
  </div>

  <!-- Asset Inspection Lightbox Modal -->
  <div class="lightbox-modal" id="lightboxModal" onclick="closeLightbox()">
    <img id="lightboxImg" alt="Asset Zoom">
  </div>
